<body class="bg-slate-900 text-slate-100 h-full antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Root container for React app -->

    <!-- React Application Script -->
    <script type="text/babel">
        const { useState, useMemo } = React;

        function App() {
            // Navigation state: 'walls' or 'ceilings'
            const [activeTab, setActiveTab] = useState('walls');

            // Modal state for PDF Quote / Pro Resources CTA
            const [showModal, setShowModal] = useState(false);
            const [clientName, setClientName] = useState('');
            const [projectName, setProjectName] = useState('');

            // --- STATE: WALLS & DIVISIONS ---
            const [wallLength, setWallLength] = useState(5.0); // meters
            const [wallHeight, setWallHeight] = useState(2.6); // meters
            const [wallFaces, setWallFaces] = useState(2); // 1 or 2 faces
            const [studSpacing, setStudSpacing] = useState(0.40); // 0.40m or 0.60m
            const [doorsCount, setDoorsCount] = useState(1);
            const [windowsCount, setWindowsCount] = useState(0);
            const [plateType, setPlateType] = useState('standard'); // standard, rh (antihumedad), rf (ignífuga)

            // --- STATE: CEILINGS & PLAFONS ---
            const [ceilingWidth, setCeilingWidth] = useState(4.0); // meters
            const [ceilingLength, setCeilingLength] = useState(5.0); // meters
            const [ceilingType, setCeilingType] = useState('junta_oculta'); // junta_oculta, desmontable

            // Wall Calculations
            const wallCalcs = useMemo(() => {
                const l = parseFloat(wallLength) || 0;
                const h = parseFloat(wallHeight) || 0;
                const faces = parseInt(wallFaces) || 2;
                const spacing = parseFloat(studSpacing) || 0.40;
                const doors = parseInt(doorsCount) || 0;
                const windows = parseInt(windowsCount) || 0;

                const grossArea = l * h;
                const openingsArea = (doors * 1.8) + (windows * 1.2); // Estimación estándar de vanos
                const netArea = Math.max(0, grossArea - openingsArea);
                const totalPlateArea = netArea * faces;

                // Planchas de yeso (Standard 1.22 x 2.44m = 2.98 m2)
                const plateAreaUnit = 2.976;
                const wasteFactorPlate = 1.07; // 7% desperdicio
                const platesCount = Math.ceil((totalPlateArea / plateAreaUnit) * wasteFactorPlate);

                // Canales perimetrales (Rieles sup/inf de 3.00m)
                const perimeterLength = (l * 2); // suelo y techo
                const wasteFactorProfiles = 1.05;
                const channelsCount = Math.ceil((perimeterLength / 3.0) * wasteFactorProfiles);

                // Montantes verticales (Parales cada spacing)
                const studsPerMeter = 1 / spacing;
                const baseStuds = Math.ceil(l * studsPerMeter) + 1;
                // Refuerzos para puertas y ventanas (aprox 2 montantes extra por vano)
                const extraStuds = (doors + windows) * 2;
                const totalStudsRaw = (baseStuds + extraStuds);
                const studsCount = Math.ceil((totalStudsRaw * (h / 3.0)) * wasteFactorProfiles);

                // Tornillos T1 (Estructura) y T2 (Placas)
                const screwsT1 = Math.round(netArea * 15); // ~15 por m2
                const screwsT2 = Math.round(totalPlateArea * 30); // ~30 por m2 de placa

                // Masilla y cinta
                const jointCompoundKg = +(netArea * 1.1 * faces).toFixed(1); // kg
                const paperTapeMeters = Math.round(netArea * 3.2 * (faces === 2 ? 1.8 : 1.0)); // metros lineales

                // Tiempo estimado de ejecución (Rendimiento cuadrilla: ~14 m2 netos por día)
                const laborDays = +(netArea / 14).toFixed(1);

                return {
                    grossArea,
                    netArea,
                    totalPlateArea,
                    platesCount,
                    channelsCount,
                    studsCount,
                    screwsT1,
                    screwsT2,
                    jointCompoundKg,
                    paperTapeMeters,
                    laborDays: Math.max(1, Math.ceil(laborDays))
                };
            }, [wallLength, wallHeight, wallFaces, studSpacing, doorsCount, windowsCount]);

            // Ceiling Calculations
            const ceilingCalcs = useMemo(() => {
                const w = parseFloat(ceilingWidth) || 0;
                const l = parseFloat(ceilingLength) || 0;
                const area = w * l;
                const perimeter = (w + l) * 2;

                const plateAreaUnit = 2.976;
                const wasteFactor = 1.05; // 5% desperdicio
                const platesCount = Math.ceil((area / plateAreaUnit) * wasteFactor);

                // Angular perimetral (tiras de 3m)
                const perimeterProfiles = Math.ceil((perimeter / 3.0) * 1.05);

                // Perfiles portantes y secundarios (Omega / Viguetas / T principal y secundaria)
                // Estimación aproximada para retícula de suspensión cada 0.60m x 1.20m
                const mainProfiles = Math.ceil((l / 1.20) * (w / 3.0));
                const secondaryProfiles = Math.ceil(area * 1.8); // metros lineales de perfil secundario

                // Puntos de suspensión (alambre galvanizado, pitones, anclajes) -> ~2.5 por m2
                const suspensionPoints = Math.round(area * 2.5);

                // Tornillos y masilla
                const screwsT1 = Math.round(area * 12);
                const screwsT2 = Math.round(area * 25);
                const jointCompoundKg = +(area * 0.9).toFixed(1);
                const paperTapeMeters = Math.round(area * 2.5);

                // Rendimiento techos: ~10 m2 por día
                const laborDays = +(area / 10).toFixed(1);

                return {
                    area,
                    perimeter,
                    platesCount,
                    perimeterProfiles,
                    mainProfiles,
                    secondaryProfiles,
                    suspensionPoints,
                    screwsT1,
                    screwsT2,
                    jointCompoundKg,
                    paperTapeMeters,
                    laborDays: Math.max(1, Math.ceil(laborDays))
                };
            }, [ceilingWidth, ceilingLength, ceilingType]);

            return (
                <div className="flex flex-col min-h-screen bg-slate-900 text-slate-100">

                                    </svg>
                                </div>
                                <div>

                                    <p className="text-xs text-slate-400">Sistema Profesional de Cuantificación para Contratistas e Ingenieros</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">

   target="_blank"

  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
  </svg>
  <span>🎓 Ver Curso & Guía de Drywall</span>
</a>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
                        
                        {/* Module Selector Tabs */}

                                        activeTab === 'walls'
                                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/50'

                                >

                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path>
                                    </svg>
                                    <span>Paredes y Divisiones</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('ceilings')}

                                        activeTab === 'ceilings'
                                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/50'
                                    }`}
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                                    </svg>
                                    <span>Techos y Plafones</span>
                                </button>
                            </div>
                        </div>

                        {}
                        {activeTab === 'walls' ? (

                                    <div className="border-b border-slate-700 pb-4">
                                        <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                                            <span>Parámetros del Muro / División</span>
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-1">Ingresa las dimensiones y especificaciones técnicas de la estructura.</p>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Longitud (m)</label>
                                                <input 
                                                    type="number" 
                                                    step="0.1" 
                                                    min="0.5"
                                                    value={wallLength} 
                                                    onChange={(e) => setWallLength(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Altura (m)</label>
                                                <input 
                                                    type="number" 
                                                    step="0.1" 
                                                    min="0.5"
                                                    value={wallHeight} 
                                                    onChange={(e) => setWallHeight(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Caras de Placa</label>
                                                <select 
                                                    value={wallFaces} 
                                                    onChange={(e) => setWallFaces(Number(e.target.value))}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                                >
                                                    <option value={1}>1 Cara (Simple)</option>
                                                    <option value={2}>2 Caras (Doble)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Separación Montantes</label>
                                                <select 
                                                    value={studSpacing} 
                                                    onChange={(e) => setStudSpacing(Number(e.target.value))}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                                >
                                                    <option value={0.40}>Cada 40 cm (Estándar)</option>
                                                    <option value={0.60}>Cada 60 cm (Económico)</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Puertas (Vanos)</label>
                                                <input 
                                                    type="number" 
                                                    min="0"
                                                    value={doorsCount} 
                                                    onChange={(e) => setDoorsCount(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Ventanas (Vanos)</label>
                                                <input 
                                                    type="number" 
                                                    min="0"
                                                    value={windowsCount} 
                                                    onChange={(e) => setWindowsCount(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Tipo de Placa Yeso (Gypsum)</label>
                                            <select 
                                                value={plateType} 
                                                onChange={(e) => setPlateType(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors"
                                            >
                                                <option value="standard">Standard (ST - 1/2" o 5/8")</option>
                                                <option value="rh">Antihumedad (RH - Verde)</option>
                                                <option value="rf">Ignífuga / Resistencia Fuego (RF - Rosa)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 flex items-center justify-between">
                                        <div>
                                            <span className="text-xs text-slate-400 block">Área Neta Calculada</span>
                                            <span className="text-xl font-bold text-indigo-400">{wallCalcs.netArea.toFixed(2)} m²</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xs text-slate-400 block">Tiempo Estimado Obra</span>
                                            <span className="text-xl font-bold text-emerald-400">{wallCalcs.laborDays} Días</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Results Grid - Right Column */}
                                <div className="lg:col-span-7 space-y-6">
                                    <div className="bg-slate-800/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 shadow-xl">
                                        <div className="border-b border-slate-700 pb-4 mb-6 flex justify-between items-center">
                                            <div>
                                                <h2 className="text-lg font-bold text-white">Desglose de Materiales (Paredes)</h2>
                                                <p className="text-xs text-slate-400">Incluye factor de desperdicio técnico aplicado automáticamente.</p>
                                            </div>
                                            <span className="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/20">
                                                Cuadrilla Base (2 Pers.)
                                            </span>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {/* Material Card 1 */}
                                            <div className="bg-slate-900/80 border border-slate-700/70 p-4 rounded-xl flex items-center justify-between">
                                                <div>
                                                    <span className="text-xs text-slate-400 font-medium">Placas de Yeso (1.22x2.44m)</span>
                                                    <h3 className="text-2xl font-extrabold text-white mt-1">{wallCalcs.platesCount} <span className="text-sm font-normal text-slate-400">unidades</span></h3>
                                                </div>
                                                <div className="p-3 bg-indigo-600/20 text-indigo-400 rounded-xl">
                                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                                </div>
                                            </div>

                                            {/* Material Card 2 */}
                                            <div className="bg-slate-900/80 border border-slate-700/70 p-4 rounded-xl flex items-center justify-between">
                                                <div>
                                                    <span className="text-xs text-slate-400 font-medium">Montantes (Parales 3m)</span>
                                                    <h3 className="text-2xl font-extrabold text-white mt-1">{wallCalcs.studsCount} <span className="text-sm font-normal text-slate-400">tiras</span></h3>

                                            {/* Material Card 3 */}
                                            <div className="bg-slate-900/80 border border-slate-700/70 p-4 rounded-xl flex items-center justify-between">

                                                    <h3 className="text-2xl font-extrabold text-white mt-1">{wallCalcs.screwsT1 + wallCalcs.screwsT2} <span className="text-sm font-normal text-slate-400">pzas</span></h3>

                                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
